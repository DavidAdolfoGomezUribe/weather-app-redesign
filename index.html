<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Weather App Redesign</title>
    <link rel="shortcut icon" href="./storage/img/Dav logo.jpg" type="image/png">
    <link rel="stylesheet" href="./css/style.css">
    <script type="module" defer src="js/main.js"></script>
</head>
<body>
    <!-- wallpaper para la app desplegable-->
    <div>
        <!-- debe agarrar el 100 % de la pantalla y tener transicion de desvanecimiento para ver la pantalla principal -->

    </div> 

    <header class="headercontainer">
        
        <div class="regioncontainer">
            <input type="text" placeholder="Region" name="country"> <img src="storage/img/searchIcon.svg" alt="searchIcon">
        </div>

        <div class="tempcontainer">
            <p>0<span>°</span></p> <!-- comportamiento default -->
        </div>
        
        <div class="feelslikecontainer">
            <p>Feels like 0<span>°</span></p>
        </div>
        
        <div class="imgweathercontainer">
            <img src="storage/img/cloud_and_sun_1.png" alt="">
            <p>cloudy</p>
        </div>

        <div class="datecontainer">
            <p>January 18, 16:14</p>
        </div>

        <div class="daynightcontainer">
            <p>Day 0<span>°</span></p>
            <p>Night 0<span>°</span></p>
        </div>

        <div class="selectioncontaienr">
            <button>Today</button>
            <button>Tomorrow</button>
            <button>10 days</button>
        </div>


    </header>
    
    <main class="maincontainer">

        <section class="windrainpressureuvcontainer">
            
            <div class="windcontainer"> 
                
                <div>

                    <img src="storage/img/air.png" alt="">
                    
                    <div>
                        <p>Wind speed</p>
                        <p>0km/h</p>
    
                    </div>
                
                </div>

                <div>
                    <!-- velocidad con respecto a la hora anterior -->
                    <img src="" alt="">
                    <p>
                        2 <span>km/h</span>
                    </p>
                </div>
           
            </div>

             
            <div class="raincontainer"> 
                
                <div>

                    <img src="storage/img/rainy.png" alt="">
                    
                    <div>
                        <p>Rain chance</p>
                        <p>0km/h</p>
    
                    </div>
                
                </div>

                <div>
                    <!-- velocidad con respecto a la hora anterior -->
                    <img src="" alt="">
                    <p>
                        2 <span>km/h</span>
                    </p>
                </div>
           
            </div>

             
            <div class="pressurecontainer"> 
                
                <div>

                    <img src="storage/img/air.png" alt="">
                    
                    <div>
                        <p>Pressure</p>
                        <p>0hpa</p>
    
                    </div>
                
                </div>

                <div>
                    <!-- velocidad con respecto a la hora anterior -->
                    <img src="" alt="">
                    <p>
                        2 <span>km/h</span>
                    </p>
                </div>
           
            </div>

             
            <div class="uvcontainer"> 
                
                <div>

                    <img src="storage/img/air.png" alt="">
                    
                    <div>
                        <p>UV index</p>
                        <p>0</p>
    
                    </div>
                
                </div>

                <div>
                    <!-- velocidad con respecto a la hora anterior -->
                    <img src="" alt="">
                    <p>
                        2 <span>km/h</span>
                    </p>
                </div>
           
            </div>


        </section>
        <section class="hourlyforecast">

        </section>

        <section class="dailyforecast">

        </section>

    </main>




    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>

</body>
</html>
