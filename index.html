<!DOCTYPE html>
<html lang="sp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Weather App Redesign</title>
    <link rel="shortcut icon" href="./storage/img/Dav logo.jpg" type="image/png">
    <link rel="stylesheet" href="./css/style.css">
    <script type="module" defer src="js/main.js"></script>
</head>
<body>
    <!-- wallpaper para la app desplegable-->
    <div>
        <!-- debe agarrar el 100 % de la pantalla y tener transicion de desvanecimiento para ver la pantalla principal -->

    </div> 

    <header class="headercontainer">
        
        <div class="regioncontainer">
            <input type="text" value="Region"> <img src="storage/img/searchIcon.svg" alt="searchIcon">
        </div>

        <div class="tempcontainer">
            <p>3<span>°</span></p>
        </div>
        
        <div class="feelslikecontainer">
            <p>Feels like -2<span>°</span></p>
        </div>
        
        <div class="imgweathercontainer">
            <img src="storage/img/cloud_and_sun_1.png" alt="">
            <p>cloudy</p>
        </div>

        <div class="datecontainer">
            <p>January 18, 16:14</p>
        </div>

        <div class="daynightcontainer">
            <p>Day 3<span>°</span></p>
            <p>Night -1<span>°</span></p>
        </div>


    </header>
    
    
    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>

</body>
</html>
